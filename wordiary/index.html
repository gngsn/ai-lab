<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>표현 카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one phone-width column — composer, latest correction, collecting list, finished card sets. */
  :root {
    --bg: #EEF5F0;
    --surface: #FFFFFF;
    --mint: #B9E2C9;
    --on-mint: #2E2E2E;
    --ink: #24302A;
    --muted: #5E6F66;
    --line: #D3E4D9;
    --btn-bg: #2E2E2E;
    --btn-fg: #B9E2C9;
    --danger: #B3402F;
    --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121815; --surface: #1A221E; --ink: #E4EFE8; --muted: #9DB2A6; --line: #2B3832;
      --btn-bg: #B9E2C9; --btn-fg: #1C2420; --danger: #F08A78; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121815; --surface: #1A221E; --ink: #E4EFE8; --muted: #9DB2A6; --line: #2B3832;
    --btn-bg: #B9E2C9; --btn-fg: #1C2420; --danger: #F08A78; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 16px; line-height: 1.55;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 48px;
  }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }
  .dots { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .dot { width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--on-mint); background: transparent; }
  .dot.on { background: var(--mint); }
  :root:not([data-theme="light"]) .dot { border-color: var(--muted); }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .dot { border-color: var(--on-mint); } }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .composer { background: var(--mint); border: none; color: var(--on-mint); }
  .composer label { font-weight: 800; font-size: 15px; }
  .composer textarea {
    width: 100%; min-height: 104px; resize: vertical;
    border: 2px solid var(--on-mint); border-radius: 14px; padding: 12px;
    font: inherit; font-size: 16px; background: #F7FBF8; color: #1E2622;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { border: none; border-radius: 12px; padding: 11px 16px; font-weight: 800; background: var(--btn-bg); color: var(--btn-fg); }
  .composer .btn { background: #2E2E2E; color: #B9E2C9; }
  .btn:disabled { opacity: .45; cursor: default; }
  .ghost { background: transparent; color: inherit; border: 1.5px solid currentColor; border-radius: 12px; padding: 9px 14px; font-weight: 700; }
  .link { background: none; border: none; padding: 4px 2px; color: var(--muted); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .danger { color: var(--danger); }
  .note { font-size: 14px; color: var(--muted); }
  .composer .note { color: #3F4C45; }

  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .section-title h2 { font-size: 17px; font-weight: 800; }

  /* correction */
  .natural { font-size: 20px; font-weight: 800; line-height: 1.4; text-wrap: balance; }
  .casual { font-size: 16px; font-weight: 600; }
  .kicker { font-size: 12px; font-weight: 800; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
  .tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .tips li { border-top: 1px solid var(--line); padding-top: 8px; min-width: 0; }
  .tips .from { text-decoration: line-through; color: var(--muted); }
  .tips .to { font-weight: 800; }
  .tips .why { display: block; font-size: 14px; color: var(--muted); }

  /* card library: every correction is already a card; tap to pick, picks are numbered in order */
  .entries { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .entry { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .entry.editing { grid-column: 1 / -1; }
  .pick { position: relative; padding: 0; border: 3px solid transparent; border-radius: 12px; background: none; display: block; width: 100%; }
  .pick img, .pick .ph { width: 100%; aspect-ratio: 1080 / 1350; border-radius: 9px; display: block; background: #111; }
  .pick[aria-pressed="true"] { border-color: var(--btn-bg); }
  .pick .num {
    position: absolute; top: 8px; right: 8px; min-width: 30px; height: 30px; padding: 0 8px;
    border-radius: 999px; display: grid; place-items: center;
    font-weight: 800; font-size: 15px; background: rgba(255,255,255,.88); color: #2E2E2E; border: 2px solid #2E2E2E;
  }
  .pick[aria-pressed="true"] .num { background: #2E2E2E; color: #B9E2C9; }
  .used { font-size: 12px; color: var(--muted); }
  .entry .row { gap: 2px 10px; }
  .bundle-bar {
    position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
  }
  .edit { display: flex; flex-direction: column; gap: 8px; }
  .edit label { font-size: 13px; font-weight: 700; color: var(--muted); }
  .edit input { width: 100%; font: inherit; padding: 9px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
  .empty { text-align: center; padding: 18px 12px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 14px; font-size: 14px; }

  /* finished sets */
  .batch { display: flex; flex-direction: column; gap: 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .grid figure { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .grid img { width: 100%; aspect-ratio: 1080 / 1350; border-radius: 8px; background: #111; display: block; }
  .grid button { font-size: 13px; }
  .sample-tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--mint); color: var(--on-mint); }
  .status { font-size: 14px; font-weight: 700; }
  .status.err { color: var(--danger); }
  @media (prefers-reduced-motion: no-preference) {
    .pulse { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
  }
</style>

<svg id="measure" width="0" height="0" style="position:absolute;visibility:hidden" aria-hidden="true"></svg>

<main>
  <header class="top">
    <h1>표현 카드</h1>
    <div class="dots" id="dots" aria-label="모은 표현 수"></div>
  </header>

  <form class="panel composer" id="composer">
    <label for="q">친구한테 쓴 영어 문장, 또는 영어로 하고 싶은 말</label>
    <textarea id="q" placeholder="예) I think fighting doesn't mean negative, it's form of saying plz fix this"></textarea>
    <div class="row">
      <button class="btn" id="ask" type="submit">교정받기</button>
      <button class="ghost" id="stop" type="button" hidden>멈추기</button>
      <span class="status" id="askStatus" role="status"></span>
    </div>
    <p class="note" id="composerNote">교정한 표현은 바로 카드가 돼요. 모인 카드 중 원하는 것만 골라 카드뉴스로 묶으세요.</p>
  </form>

  <section class="panel" id="result" hidden aria-live="polite">
    <div>
      <p class="kicker">자연스럽게</p>
      <p class="natural" id="rNatural"></p>
    </div>
    <div id="rCasualWrap">
      <p class="kicker">더 편하게</p>
      <p class="casual" id="rCasual"></p>
    </div>
    <ul class="tips" id="rTips"></ul>
    <p class="note" id="rComment"></p>
    <div class="row">
      <button class="ghost" id="copy" type="button">문장 복사</button>
      <span class="note" id="rSaved"></span>
    </div>
  </section>

  <section class="panel" aria-labelledby="collectTitle">
    <div class="section-title">
      <h2 id="collectTitle">내 카드</h2>
      <button class="link" id="clearSel" type="button" hidden>선택 해제</button>
    </div>
    <p class="note">카드를 눌러 고르면 고른 순서대로 번호가 붙어요. 최대 7장까지 한 카드뉴스로 묶을 수 있어요.</p>
    <ul class="entries" id="entries"></ul>
    <p class="empty" id="entriesEmpty">아직 카드가 없어요. 위에 문장을 넣고 교정받으면 카드가 바로 생겨요.</p>
    <div class="bundle-bar" id="bundleBar" hidden>
      <span class="status" id="selCount"></span>
      <button class="btn" id="bundle" type="button">카드뉴스로 묶기</button>
    </div>
  </section>

  <section class="panel" aria-labelledby="setsTitle">
    <div class="section-title">
      <h2 id="setsTitle">카드뉴스</h2>
    </div>
    <p class="note">이미지를 길게 눌러 사진에 저장하거나, 저장 버튼을 누르세요.</p>
    <div id="batches" class="batch-list"></div>
  </section>
</main>
