<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>표현 카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one phone-width column — composer, latest correction, collecting list, finished card sets. */
  :root {
    --bg: #EEF5F0;
    --surface: #FFFFFF;
    --mint: #B9E2C9;
    --on-mint: #2E2E2E;
    --ink: #24302A;
    --muted: #5E6F66;
    --line: #D3E4D9;
    --btn-bg: #2E2E2E;
    --btn-fg: #B9E2C9;
    --danger: #B3402F;
    --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121815; --surface: #1A221E; --ink: #E4EFE8; --muted: #9DB2A6; --line: #2B3832;
      --btn-bg: #B9E2C9; --btn-fg: #1C2420; --danger: #F08A78; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121815; --surface: #1A221E; --ink: #E4EFE8; --muted: #9DB2A6; --line: #2B3832;
    --btn-bg: #B9E2C9; --btn-fg: #1C2420; --danger: #F08A78; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 16px; line-height: 1.55;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 48px;
  }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }
  .dots { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .dot { width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--on-mint); background: transparent; }
  .dot.on { background: var(--mint); }
  :root:not([data-theme="light"]) .dot { border-color: var(--muted); }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .dot { border-color: var(--on-mint); } }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .composer { background: var(--mint); border: none; color: var(--on-mint); }
  .composer label { font-weight: 800; font-size: 15px; }
  .composer textarea {
    width: 100%; min-height: 104px; resize: vertical;
    border: 2px solid var(--on-mint); border-radius: 14px; padding: 12px;
    font: inherit; font-size: 16px; background: #F7FBF8; color: #1E2622;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { border: none; border-radius: 12px; padding: 11px 16px; font-weight: 800; background: var(--btn-bg); color: var(--btn-fg); }
  .composer .btn { background: #2E2E2E; color: #B9E2C9; }
  .btn:disabled { opacity: .45; cursor: default; }
  .ghost { background: transparent; color: inherit; border: 1.5px solid currentColor; border-radius: 12px; padding: 9px 14px; font-weight: 700; }
  .link { background: none; border: none; padding: 4px 2px; color: var(--muted); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .danger { color: var(--danger); }
  .note { font-size: 14px; color: var(--muted); }
  .composer .note { color: #3F4C45; }

  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .section-title h2 { font-size: 17px; font-weight: 800; }

  /* correction */
  .natural { font-size: 20px; font-weight: 800; line-height: 1.4; text-wrap: balance; }
  .casual { font-size: 16px; font-weight: 600; }
  .kicker { font-size: 12px; font-weight: 800; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
  .tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .tips li { border-top: 1px solid var(--line); padding-top: 8px; min-width: 0; }
  .tips .from { text-decoration: line-through; color: var(--muted); }
  .tips .to { font-weight: 800; }
  .tips .why { display: block; font-size: 14px; color: var(--muted); }

  /* card library: every correction is already a card; tap to pick, picks are numbered in order */
  .entries { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .entry { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .entry.editing { grid-column: 1 / -1; }
  .pick { position: relative; padding: 0; border: 3px solid transparent; border-radius: 12px; background: none; display: block; width: 100%; }
  .pick img, .pick .ph { width: 100%; aspect-ratio: 1080 / 1350; border-radius: 9px; display: block; background: #111; }
  .pick[aria-pressed="true"] { border-color: var(--btn-bg); }
  .pick .num {
    position: absolute; top: 8px; right: 8px; min-width: 30px; height: 30px; padding: 0 8px;
    border-radius: 999px; display: grid; place-items: center;
    font-weight: 800; font-size: 15px; background: rgba(255,255,255,.88); color: #2E2E2E; border: 2px solid #2E2E2E;
  }
  .pick[aria-pressed="true"] .num { background: #2E2E2E; color: #B9E2C9; }
  .used { font-size: 12px; color: var(--muted); }
  .entry .row { gap: 2px 10px; }
  .bundle-bar {
    position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
  }
  .edit { display: flex; flex-direction: column; gap: 8px; }
  .edit label { font-size: 13px; font-weight: 700; color: var(--muted); }
  .edit input { width: 100%; font: inherit; padding: 9px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
  .empty { text-align: center; padding: 18px 12px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 14px; font-size: 14px; }

  /* finished sets */
  .batch { display: flex; flex-direction: column; gap: 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .grid figure { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .grid img { width: 100%; aspect-ratio: 1080 / 1350; border-radius: 8px; background: #111; display: block; }
  .grid button { font-size: 13px; }
  .sample-tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--mint); color: var(--on-mint); }
  .status { font-size: 14px; font-weight: 700; }
  .status.err { color: var(--danger); }
  @media (prefers-reduced-motion: no-preference) {
    .pulse { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
  }
</style>

<svg id="measure" width="0" height="0" style="position:absolute;visibility:hidden" aria-hidden="true"></svg>

<main>
  <header class="top">
    <h1>표현 카드</h1>
    <div class="dots" id="dots" aria-label="모은 표현 수"></div>
  </header>

  <form class="panel composer" id="composer">
    <label for="q">친구한테 쓴 영어 문장, 또는 영어로 하고 싶은 말</label>
    <textarea id="q" placeholder="예) I think fighting doesn't mean negative, it's form of saying plz fix this"></textarea>
    <div class="row">
      <button class="btn" id="ask" type="submit">교정받기</button>
      <button class="ghost" id="stop" type="button" hidden>멈추기</button>
      <span class="status" id="askStatus" role="status"></span>
    </div>
    <p class="note" id="composerNote">교정한 표현은 바로 카드가 돼요. 모인 카드 중 원하는 것만 골라 카드뉴스로 묶으세요.</p>
  </form>

  <section class="panel" id="result" hidden aria-live="polite">
    <div>
      <p class="kicker">자연스럽게</p>
      <p class="natural" id="rNatural"></p>
    </div>
    <div id="rCasualWrap">
      <p class="kicker">더 편하게</p>
      <p class="casual" id="rCasual"></p>
    </div>
    <ul class="tips" id="rTips"></ul>
    <p class="note" id="rComment"></p>
    <div class="row">
      <button class="ghost" id="copy" type="button">문장 복사</button>
      <span class="note" id="rSaved"></span>
    </div>
  </section>

  <section class="panel" aria-labelledby="collectTitle">
    <div class="section-title">
      <h2 id="collectTitle">내 카드</h2>
      <button class="link" id="clearSel" type="button" hidden>선택 해제</button>
    </div>
    <p class="note">카드를 눌러 고르면 고른 순서대로 번호가 붙어요. 최대 7장까지 한 카드뉴스로 묶을 수 있어요.</p>
    <ul class="entries" id="entries"></ul>
    <p class="empty" id="entriesEmpty">아직 카드가 없어요. 위에 문장을 넣고 교정받으면 카드가 바로 생겨요.</p>
    <div class="bundle-bar" id="bundleBar" hidden>
      <span class="status" id="selCount"></span>
      <button class="btn" id="bundle" type="button">카드뉴스로 묶기</button>
    </div>
  </section>

  <section class="panel" aria-labelledby="setsTitle">
    <div class="section-title">
      <h2 id="setsTitle">카드뉴스</h2>
    </div>
    <p class="note">이미지를 길게 눌러 사진에 저장하거나, 저장 버튼을 누르세요.</p>
    <div id="batches" class="batch-list"></div>
  </section>
</main>

<script>
/* ---------------- capability access ---------------- */
const use = (name) => (window.claude && window.claude.use) ? window.claude.use(name) : Promise.resolve(null);

/* ---------------- fonts (bundled Pretendard, loaded as binary so the frame's font rules don't matter) ---------------- */
const FONT_FILES = { 400: "Regular", 600: "SemiBold", 700: "Bold", 800: "ExtraBold" };
const fontsReady = Promise.all(Object.entries(FONT_FILES).map(async ([w, n]) => {
  try {
    const buf = await (await fetch(`fonts/Pretendard-${n}.woff2`)).arrayBuffer();
    const face = new FontFace("Pretendard", buf, { weight: w });
    await face.load();
    document.fonts.add(face);
  } catch (e) { /* falls back to the system Korean font */ }
}));

/* ---------------- icons (200×200 drawings; modes: s = line, sf = mint fill + line, d = ink fill) ---------------- */
const C = (cx, cy, r) => `M${cx - r} ${cy} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0 Z`;
const E = (cx, cy, rx, ry) => `M${cx - rx} ${cy} a${rx} ${ry} 0 1 0 ${2 * rx} 0 a${rx} ${ry} 0 1 0 ${-2 * rx} 0 Z`;
const R = (x, y, w, h, r) => `M${x + r} ${y} L${x + w - r} ${y} Q${x + w} ${y} ${x + w} ${y + r} L${x + w} ${y + h - r} Q${x + w} ${y + h} ${x + w - r} ${y + h} L${x + r} ${y + h} Q${x} ${y + h} ${x} ${y + h - r} L${x} ${y + r} Q${x} ${y} ${x + r} ${y} Z`;

const ICONS = {
  eye: [["M18 100 Q100 22 182 100 Q100 178 18 100 Z", "sf"], [C(100, 100, 30), "s"], [C(100, 100, 9), "d"], ["M58 58 L46 36 M100 46 L100 22 M142 58 L154 36", "s"]],
  battery: [[R(22, 58, 140, 84, 16), "s"], [R(162, 84, 16, 32, 4), "s"], ["M106 70 L78 106 L104 106 L92 132 L124 92 L98 92 Z", "s"]],
  tea: [["M80 64 Q68 50 80 38 Q92 26 80 12 M118 64 Q106 50 118 38 Q130 26 118 12", "s"], ["M150 98 Q184 96 180 122 Q176 144 146 138", "s"], ["M42 84 L158 84 L150 140 Q146 162 124 162 L76 162 Q54 162 50 140 Z", "sf"], ["M100 132 C84 120 88 106 100 115 C112 106 116 120 100 132 Z", "s"], ["M26 180 L174 180", "s"]],
  bubbles: [[E(80, 74, 62, 44), "sf"], ["M56 114 L40 144 L84 117", "sf"], [C(58, 74, 7), "d"], [C(80, 74, 7), "d"], [C(102, 74, 7), "d"], [E(124, 130, 58, 42), "sf"], ["M146 168 L164 192 L126 171", "sf"], ["M124 146 C100 128 108 110 124 122 C140 110 148 128 124 146 Z", "s"]],
  sun: [["M100 16 L100 38 M100 162 L100 184 M16 100 L38 100 M162 100 L184 100 M41 41 L56 56 M144 144 L159 159 M159 41 L144 56 M56 144 L41 159", "s"], [C(100, 100, 44), "sf"], [C(86, 94, 5), "d"], [C(114, 94, 5), "d"], ["M84 110 Q100 124 116 110", "s"]],
  heart: [["M100 168 C40 128 22 92 40 62 C58 34 92 40 100 66 C108 40 142 34 160 62 C178 92 160 128 100 168 Z", "s"]],
  home: [["M30 96 L100 36 L170 96", "s"], ["M52 82 L52 168 L148 168 L148 82", "s"], [R(86, 118, 28, 50, 4), "s"]],
  clock: [[C(100, 100, 70), "s"], ["M100 100 L100 58 M100 100 L130 116", "s"], [C(100, 100, 6), "d"]],
  star: [["M100 26 L120 76 L174 78 L132 112 L146 166 L100 136 L54 166 L68 112 L26 78 L80 76 Z", "s"]],
  gift: [[R(34, 82, 132, 34, 6), "s"], [R(46, 116, 108, 58, 6), "s"], ["M100 82 L100 174", "s"], ["M100 82 C80 50 52 58 66 78 C72 86 90 84 100 82 C110 84 128 86 134 78 C148 58 120 50 100 82", "s"]],
  plane: [["M24 108 L176 46 L132 164 L104 118 Z", "s"], ["M104 118 L176 46", "s"]],
  music: [["M76 150 L76 52 L156 36 L156 134", "s"], [E(62, 150, 18, 14), "d"], [E(142, 134, 18, 14), "d"]],
  book: [["M100 56 C76 40 48 40 26 48 L26 160 C48 152 76 152 100 168 C124 152 152 152 174 160 L174 48 C152 40 124 40 100 56 Z", "s"], ["M100 56 L100 168", "s"]],
  phone: [[R(62, 24, 76, 152, 16), "s"], ["M90 150 L110 150", "s"]],
  flower: [["M100 152 L100 188", "s"], [C(100, 60, 22), "sf"], [C(138, 88, 22), "sf"], [C(124, 132, 22), "sf"], [C(76, 132, 22), "sf"], [C(62, 88, 22), "sf"], [C(100, 100, 18), "sf"]],
  umbrella: [["M24 108 C34 50 166 50 176 108 C160 96 140 96 124 108 C112 96 88 96 76 108 C60 96 40 96 24 108 Z", "s"], ["M100 108 L100 160 Q100 178 84 176 Q74 174 74 162", "s"], ["M100 40 L100 56", "s"]],
  moon: [["M128 30 C80 34 52 70 56 110 C60 152 100 180 146 168 C108 160 86 128 90 92 C94 60 108 40 128 30 Z", "s"], [C(152, 70, 6), "d"], [C(164, 112, 5), "d"]],
  smile: [[C(100, 100, 72), "s"], [C(76, 84, 7), "d"], [C(124, 84, 7), "d"], ["M68 116 Q100 148 132 116", "s"]],
  car: [[R(26, 92, 148, 52, 14), "s"], ["M50 92 L70 58 L130 58 L150 92", "s"], [C(64, 146, 14), "sf"], [C(136, 146, 14), "sf"]],
  bowl: [["M70 82 Q62 66 70 52 M100 82 Q92 64 100 46 M130 82 Q122 66 130 52", "s"], ["M28 96 L172 96 C170 140 140 168 100 168 C60 168 30 140 28 96 Z", "s"], ["M70 182 L130 182", "s"]],
  camera: [[R(28, 62, 144, 100, 16), "s"], [C(100, 112, 30), "s"], ["M70 62 L82 42 L118 42 L130 62", "s"]],
  mountain: [["M18 168 L76 72 L108 120 L132 90 L182 168 Z", "s"], [C(150, 52, 14), "s"]],
  chat: [[E(100, 92, 74, 54), "sf"], ["M70 140 L54 176 L104 146", "sf"]],
  drop: [["M100 28 C100 28 52 92 52 124 C52 152 74 172 100 172 C126 172 148 152 148 124 C148 92 100 28 100 28 Z", "s"]],
  // section markers on cards
  alt: [["M36 72 L164 72 M132 42 L164 72 L132 102", "s"], ["M164 132 L36 132 M68 102 L36 132 L68 162", "s"]],
  tip: [["M100 24 C60 24 40 56 48 88 C53 108 70 118 74 138 L126 138 C130 118 147 108 152 88 C160 56 140 24 100 24 Z", "s"], ["M78 162 L122 162 M88 184 L112 184", "s"]],
};
const ICON_HINTS = {
  eye: "관찰, 보기, 알아차림", battery: "에너지, 휴식, 피곤", tea: "위로, 안심, 돌봄", bubbles: "대화, 공감, 이해",
  sun: "밝음, 긍정, 따뜻함", heart: "사랑, 고마움, 마음", home: "집, 가족", clock: "시간, 기다림, 약속",
  star: "칭찬, 잘함, 특별함", gift: "선물, 축하, 생일", plane: "여행, 떠남, 출발", music: "음악, 노래, 공연",
  book: "공부, 배움, 일", phone: "연락, 전화, 문자", flower: "감사, 예쁨, 응원", umbrella: "날씨, 보호, 챙김",
  moon: "밤, 잠, 늦게", smile: "기쁨, 웃음, 재미", car: "이동, 운전, 사고", bowl: "음식, 식사, 요리",
  camera: "사진, 추억", mountain: "도전, 야외, 운동", chat: "말, 의견, 생각", drop: "슬픔, 눈물, 속상함",
};
const PICKABLE = Object.keys(ICON_HINTS);

/* ---------------- hand-drawn line geometry (seeded, periodic wobble so closed shapes stay seamless) ---------------- */
const iconCache = {};
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function hash(str) { let h = 2166136261; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function iconPolys(name) {
  if (iconCache[name]) return iconCache[name];
  const host = document.getElementById("measure");
  const out = []; let seed = hash(name);
  for (const [d, mode] of (ICONS[name] || ICONS.chat)) {
    for (const sub of d.split(/(?=M)/)) {
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", sub); host.appendChild(p);
      const L = p.getTotalLength();
      const n = Math.max(10, Math.ceil(L / 3));
      const r = rng(seed++);
      const ph = [r(), r(), r(), r()].map((v) => v * Math.PI * 2);
      const k1 = Math.max(1, Math.round(L / 80)), k2 = Math.max(2, Math.round(L / 28));
      const amp = Math.min(1, L / 160);
      const closed = /z\s*$/i.test(sub.trim());
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const t = (L * i) / n, a = (2 * Math.PI * t) / L, q = p.getPointAtLength(t);
        pts.push([
          q.x + amp * (1.5 * Math.sin(k1 * a + ph[0]) + 0.6 * Math.sin(k2 * a + ph[1])),
          q.y + amp * (1.5 * Math.sin(k1 * a + ph[2]) + 0.6 * Math.sin(k2 * a + ph[3])),
        ]);
      }
      p.remove();
      out.push({ pts, mode, closed });
    }
  }
  return (iconCache[name] = out);
}

/* ---------------- card renderer (1080×1350, head:art:en:sec = 1:2:2:2) ---------------- */
const CW = 1080, CH = 1350;
const COL = { frame: "#111111", mint: "#B9E2C9", ink: "#2E2E2E", soft: "#4A4A4A" };
const F = (w, s) => `${w} ${s}px Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
const X0 = 108, IW = 864, TOP = 104, BOT = 1238;
const pad2 = (n) => String(n).padStart(2, "0");

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawIcon(ctx, name, x, y, size, sw) {
  const s = size / 200;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = sw; ctx.strokeStyle = COL.ink;
  for (const { pts, mode, closed } of iconPolys(name)) {
    ctx.beginPath();
    pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
    if (closed) ctx.closePath();
    if (mode === "d") { ctx.fillStyle = COL.ink; ctx.fill(); continue; }
    if (mode === "sf") { ctx.fillStyle = COL.mint; ctx.fill(); }
    ctx.stroke();
  }
  ctx.restore();
}
function tokens(ctx, runs, maxW) {
  const out = [];
  for (const r of runs) {
    for (const part of r.text.split(/(\s+)/)) {
      if (!part) continue;
      const space = /^\s+$/.test(part);
      ctx.font = r.font;
      const t = { text: space ? " " : part, font: r.font, color: r.color, space };
      t.w = ctx.measureText(t.text).width;
      if (!space && t.w > maxW) {

    en: s(card?.en, 160) || fallbackEn,
