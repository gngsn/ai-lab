<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Controller Deck</title>
    <!-- Test deck in "deck mode": it brings its own SlidePresentation
         controller, like the real talk decks (see js/deck-host.js). -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee; font: 24px sans-serif; }
      main { transition: transform 0.6s ease; will-change: transform; }
      .slide { height: 100vh; overflow: hidden; padding: 40px; box-sizing: border-box; }
      .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
      .slide.visible .reveal { opacity: 1; transform: none; }
      .fragment { opacity: 0; transition: opacity 0.3s ease; }
      .fragment.show { opacity: 1; }
    </style>
  </head>
  <body>
    <main>
      <section class="slide" data-title="Opening">
        <h1 class="reveal">Opening</h1>
      </section>
      <section class="slide visible" data-title="Saved state">
        <h1 class="reveal">Saved state</h1>
        <p class="fragment show">already shown when saved</p>
      </section>
      <section class="slide" data-title="Two steps">
        <h1 class="reveal">Two steps</h1>
        <p class="fragment">step one</p>
        <p class="fragment">step two</p>
      </section>
      <section class="slide" data-title="Grouped">
        <h1 class="reveal">Grouped</h1>
        <p class="fragment" data-fragment-group="g1">left</p>
        <p class="fragment" data-fragment-group="g1">right</p>
      </section>
      <section class="slide" data-title="Plain middle">
        <h1 class="reveal">Plain middle</h1>
        <img src="https://fake.supabase.test/storage/v1/object/public/slides-images/_library/pixel.png" alt="pixel" width="40" height="40" />
      </section>
      <section class="slide" data-title="Closing">
        <h1 class="reveal">Closing</h1>
      </section>
    </main>
    <script>
      class SlidePresentation {
        constructor() {
          this.slides = Array.from(document.querySelectorAll(".slide"));
          this.currentSlide = 0;
          this.main = document.querySelector("main");
          document.addEventListener("keydown", (e) => {
            if (["ArrowDown", "ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); this.next(); }
            if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); this.prev(); }
            if (e.key === "Home") { e.preventDefault(); this.goTo(0); }
            if (e.key === "End") { e.preventDefault(); this.goTo(this.slides.length - 1); }
          });
        }
        goTo(idx) {
          if (idx < 0 || idx >= this.slides.length) return;
          this.currentSlide = idx;
          this.main.style.transform = `translateY(calc(${-idx} * 100vh))`;
          this.slides[idx].classList.add("visible");
          document.dispatchEvent(new CustomEvent("slidechange", { detail: { index: idx } }));
        }
        next() {
          const slide = this.slides[this.currentSlide];
          const pending = slide.querySelector(".fragment:not(.show)");
          if (pending) {
            const group = pending.dataset.fragmentGroup;
            if (group) slide.querySelectorAll(`.fragment[data-fragment-group="${group}"]:not(.show)`).forEach((el) => el.classList.add("show"));
            else pending.classList.add("show");
            return;
          }
          if (this.currentSlide < this.slides.length - 1) this.goTo(this.currentSlide + 1);
        }
        prev() {
          const slide = this.slides[this.currentSlide];
          const shown = [...slide.querySelectorAll(".fragment.show")];
          if (shown.length) {
            const last = shown[shown.length - 1];
            const group = last.dataset.fragmentGroup;
            if (group) slide.querySelectorAll(`.fragment[data-fragment-group="${group}"].show`).forEach((el) => el.classList.remove("show"));
            else last.classList.remove("show");
            return;
          }
          if (this.currentSlide > 0) this.goTo(this.currentSlide - 1);
        }
      }
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelector(".slide")?.classList.add("visible");
        new SlidePresentation();
      });
    </script>
  </body>
</html>
