<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pronunciation Training</title>
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="./css/training-panel.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --accent: var(--se-primary);
        --bg: var(--se-bg);
        --surface: var(--se-bg);
        --surface-2: var(--se-fill);
        --border: var(--se-ink);
        --border-2: var(--se-rule);
        --text: var(--se-ink);
        --text-mid: var(--se-muted);
        --text-bright: var(--se-strong);
        --green: var(--se-ok);
        --yellow: var(--se-warn);
        --red: var(--se-bad);
        --blue: var(--se-ink);
      }
      body {
        accent-color: var(--se-ink);
        background: var(--bg);
        color: var(--text);
        font-family: "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
        height: 100vh;
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-rows: 48px 1fr;
        height: 100vh;
      }

      /* ── Toolbar ── */
      #toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      #toolbar .title {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-bright);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 240px;
        font-family: "Fraunces", "IBM Plex Sans KR", Georgia, serif;
        font-weight: 400;
        letter-spacing: -0.02em;
      }
      #toolbar .spacer {
        flex: 1;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-mid);
        padding: 5px 10px;
        border-radius: 0;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
        transition:
          background 0.12s,
          color 0.12s,
          border-color 0.12s;
      }
      .btn:hover {
        background: var(--se-fill);
        color: var(--text);
        border-color: var(--se-rule);
      }
      .btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        pointer-events: none;
      }
      .btn.home {
        color: var(--text-bright);
      }
      .btn.primary {
        color: var(--blue);
        border-color: var(--blue);
      }
      .btn.primary:hover {
        background: color-mix(in srgb, var(--se-ink) 12%, transparent);
      }
      .btn.ok {
        color: var(--green);
        border-color: var(--green);
      }
      .btn.ok:hover {
        background: color-mix(in srgb, var(--se-ok) 12%, transparent);
      }
      .btn.warn {
        color: var(--yellow);
        border-color: var(--yellow);
      }
      .btn.danger {
        color: var(--red);
        border-color: var(--red);
      }
      .btn.recording {
        color: var(--red);
        border-color: var(--red);
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }

      /* Speed */
      .speed-wrap {
        display: flex;
        align-items: center;
        gap: 5px;
        font:
          11px "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
        color: var(--text-mid);
      }
      .speed-wrap input[type="range"] {
        width: 70px;
        accent-color: var(--blue);
      }
      #speed-label {
        color: var(--text);
        min-width: 32px;
      }

      /* TTS engine selector */
      #tts-engine {
        background: var(--surface-2);
        border: 1px solid var(--border-2);
        border-radius: 0;
        color: var(--text);
        font:
          11px "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
        padding: 2px 6px;
        cursor: pointer;
        height: 26px;
      }
      #tts-engine:focus {
        outline: none;
        border-color: var(--accent);
      }

      /* Export */
      #export-progress {
        width: 72px;
        height: 3px;
        background: var(--border);
        border-radius: 0;
        overflow: hidden;
        display: none;
      }
      #export-progress-bar {
        height: 100%;
        background: var(--blue);
        width: 0%;
        transition: width 0.25s;
      }
      #export-status {
        font:
          11px "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
        color: var(--text-mid);
        min-width: 80px;
      }

      /* ── 3-pane grid ── */
      :root {
        --sec-list-width: 220px;
        --training-width: 340px;
      }
      #main-grid {
        display: grid;
        grid-template-columns: var(--sec-list-width) 1fr var(--training-width);
        height: calc(100vh - 48px);
        overflow: hidden;
      }

      /* ── Section list (left) ── */
      #section-list {
        position: relative;
        background: var(--surface);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 8px;
      }
      .sec-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        margin-bottom: 4px;
        border-radius: 0;
        cursor: pointer;
        font-size: 12px;
        color: var(--text-mid);
        border: 1px solid transparent;
        user-select: none;
        transition:
          background 0.1s,
          color 0.1s;
      }
      .sec-item:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      .sec-item.active {
        background: var(--se-fill-active);
        color: var(--text-bright);
        border-color: var(--accent);
      }
      .sec-item .num {
        font:
          10px "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
        color: var(--text-mid);
        min-width: 18px;
        text-align: right;
      }
      .sec-item .label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sec-score {
        font:
          10px "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
        padding: 1px 5px;
        border-radius: 0;
        display: none;
      }
      .sec-score.show {
        display: inline-block;
      }
      .sec-score.great {
        background: color-mix(in srgb, var(--se-ok) 15%, transparent);
        color: var(--green);
      }
      .sec-score.ok {
        background: color-mix(in srgb, var(--se-warn) 15%, transparent);
        color: var(--yellow);
      }
      .sec-score.poor {
        background: color-mix(in srgb, var(--se-bad) 15%, transparent);
        color: var(--red);
      }

      /* ── Script pane (middle) ── */
      #script-pane {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        overflow: hidden;
        background: var(--bg);
      }
      #script-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        gap: 8px;
        flex-shrink: 0;
      }
      #script-heading .slide-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--se-primary-text);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #script-heading .slide-num {
        font:
          11px "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
        color: var(--text-mid);
      }

      /* Slide preview: 16:9 */
      #slide-preview-wrap {
        flex: 0 0 auto;
        background: var(--se-rule);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        overflow: hidden;
        max-height: 45%;
        min-height: 120px;
      }
      #slide-stage {
        width: 100%;
        aspect-ratio: 16 / 9;
        max-width: 100%;
        max-height: 100%;
        position: relative;
        overflow: hidden;
        box-shadow: none;
      }
      #slide-stage iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--se-bg);
        display: block;
        pointer-events: none;
      }

      /* Script text */
      #script-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        font-size: 14px;
        line-height: 1.9;
        color: var(--text-bright);
        word-break: keep-all;
        white-space: pre-wrap;
        border-top: 1px solid var(--border);
      }
      #script-body.empty {
        color: var(--text-mid);
        font-style: italic;
        font-size: 13px;
      }

      /* ── Training panel (right) ── */
      #training-panel {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* ── Resizers ── */
      .col-resizer {
        position: absolute;
        top: 0;
        width: 8px;
        height: 100%;
        cursor: col-resize;
        touch-action: none;
        z-index: 10;
      }
      #sec-resizer {
        right: -4px;
      }
      #trn-resizer {
        left: -4px;
      }
      .col-resizer::before {
        content: "";
        position: absolute;
        inset: 0;
        background: transparent;
        transition: background 0.15s;
      }
      .col-resizer:hover::before,
      .col-resizer.dragging::before {
        background: color-mix(in srgb, var(--se-primary) 15%, transparent);
      }

      /* loading */
      #loading {
        grid-column: 1/-1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-mid);
        font-size: 13px;
      }
      /* ── Mobile: stack section list / slide + script / training ── */
      @media (max-width: 768px) {
        body {
          height: auto;
          overflow: auto;
        }
        #app {
          height: auto;
          grid-template-columns: minmax(0, 1fr);
        }
        /* Toolbar becomes a horizontally scrollable strip instead of
           widening the page. */
        #toolbar {
          min-width: 0;
          flex-wrap: nowrap;
          overflow-x: auto;
          overflow-y: hidden;
          scrollbar-width: none;
        }
        #toolbar::-webkit-scrollbar {
          display: none;
        }
        #toolbar > * {
          flex-shrink: 0;
        }
        #main-grid {
          display: flex;
          flex-direction: column;
          height: auto;
          overflow: visible;
        }
        #section-list {
          max-height: 30vh;
          overflow-y: auto;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
        #training-panel {
          min-height: 60vh;
          border-left: 0;
          border-top: 1px solid var(--border);
        }
        .col-resizer {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <a class="btn home" href="./index.html" title="Home">🏠</a>
        <span class="title" id="deck-title">…</span>
        <span class="spacer"></span>
        <div class="speed-wrap">
          <span>Speed</span>
          <input
            type="range"
            id="speed-slider"
            min="0.7"
            max="1.5"
            step="0.05"
            value="1.0"
          />
          <span id="speed-label">1.0×</span>
        </div>
        <select id="tts-engine" title="TTS Engine">
          <option value="kokoro">🏠 Local (Kokoro)</option>
          <option value="openai">☁️ OpenAI</option>
          <option value="elevenlabs">🎤 ElevenLabs</option>
        </select>
        <button class="btn primary" id="export-btn">⬇ Export</button>
        <div id="export-progress"><div id="export-progress-bar"></div></div>
        <span id="export-status"></span>
        <a class="btn" id="notes-link" href="#">📝 Notes</a>
      </header>

      <main id="main-grid">
        <div id="loading">Loading…</div>
      </main>
    </div>

    <script src="./js/config.local.js"></script>
    <script type="module" src="./js/pronunciation.js"></script>
  </body>
</html>
