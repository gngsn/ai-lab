<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Listening — English Studio</title>
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      #main-grid {
        grid-template-columns: 230px 1fr;
      }
      #article-form {
        max-width: 760px;
        margin: 0 auto;
      }
      #article-form textarea {
        height: 45vh;
      }
      #article-form .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        align-items: center;
      }
      #article-form input[type="text"] {
        flex: 1;
        height: 30px;
        font-size: 13px;
        font-family: inherit;
      }
      #reader-controls {
        display: flex;
        gap: 8px;
        align-items: center;
        max-width: 760px;
        margin: 0 auto 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <a class="btn" href="./index.html" title="Home">🏠</a>
        <span class="title">🎧 리스닝</span>
        <nav>
          <a href="./listening.html">Listening</a>
          <a href="./speaking.html">Speaking</a>
          <a href="./writing.html">Writing</a>
        </nav>
        <span class="spacer"></span>
        <div class="speed-wrap">
          <span>Speed</span>
          <input type="range" id="speed-slider" min="0.6" max="1.5" step="0.05" value="1.0" />
          <span class="speed-label" id="speed-label">1.0×</span>
        </div>
        <select id="tts-engine" title="TTS Engine">
          <option value="kokoro">🏠 Local (Kokoro)</option>
          <option value="openai">☁️ OpenAI</option>
          <option value="elevenlabs">🎤 ElevenLabs</option>
        </select>
      </header>

      <main class="main-grid" id="main-grid">
        <aside class="sidebar">
          <div class="side-head">
            <span>Articles</span>
            <button class="btn" id="new-article-btn" title="새 아티클">＋</button>
          </div>
          <div id="article-list"></div>
        </aside>

        <section class="pane" id="content-pane">
          <!-- paste form -->
          <div id="article-form">
            <h3>새 아티클 붙여넣기</h3>
            <div class="row" style="margin: 0 0 10px">
              <input type="text" id="article-title" placeholder="제목 (비우면 첫 문장 사용)" />
            </div>
            <textarea
              id="article-text"
              placeholder="영어 아티클을 붙여넣으세요. 문단은 빈 줄로 구분됩니다."
            ></textarea>
            <div class="row">
              <button class="btn primary" id="load-btn">📖 읽기 시작</button>
              <span class="stt-status" id="form-status"></span>
            </div>
          </div>

          <!-- reader -->
          <div id="reader-view" style="display: none">
            <div id="reader-controls">
              <button class="btn accent" id="play-all-btn">▶ 전체 재생</button>
              <button class="btn" id="stop-btn">⏹ 정지</button>
              <label class="stt-status" style="display: inline-flex; align-items: center; gap: 4px; cursor: pointer">
                <input type="checkbox" id="repeat-chk" /> 문장 반복
              </label>
              <span class="stt-status" id="play-status"></span>
            </div>
            <article id="reader"></article>
          </div>
        </section>
      </main>
    </div>

    <script src="./js/config.local.js"></script>
    <script type="module" src="./js/listening.js"></script>
  </body>
</html>
