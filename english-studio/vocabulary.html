<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vocabulary — English Studio</title>
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      #main-grid {
        grid-template-columns: 220px 1fr;
      }
      #search-row {
        display: flex;
        gap: 8px;
        max-width: 640px;
        margin: 0 auto 24px;
      }
      #word-input {
        flex: 1;
        height: 38px;
        font-size: 15px;
        font-family: inherit;
      }
      #search-row .btn {
        height: 38px;
        padding: 0 16px;
      }
      #vocab-view {
        max-width: 760px;
        margin: 0 auto;
      }
      .word-hero {
        text-align: center;
        margin-bottom: 20px;
      }
      .word-hero .headword {
        font-size: 32px;
        font-weight: 700;
        color: var(--text-bright);
      }
      .vocab-hint {
        color: var(--text-mid);
        font-size: 13px;
        font-style: italic;
        line-height: 1.8;
        word-break: keep-all;
        text-align: center;
        margin-top: 60px;
      }

      /* ── Rendered markdown body (js/markdown.js output) ── */
      .md-body {
        font-size: 14px;
        line-height: 1.9;
        color: var(--text);
        word-break: keep-all;
      }
      .md-body .md-h {
        color: var(--accent);
        margin: 22px 0 8px;
        font-weight: 600;
        /* Reset against the page-wide .pane h3 rule (sidebar/section
           labels elsewhere in the app), which would otherwise leak
           uppercase/letter-spacing into these AI-generated headings. */
        text-transform: none;
        letter-spacing: normal;
      }
      .md-body h4.md-h {
        font-size: 16px;
      }
      .md-body h5.md-h {
        font-size: 14px;
      }
      .md-body p {
        margin-bottom: 10px;
      }
      .md-body strong {
        color: var(--yellow);
        font-weight: 700;
      }
      .md-body code {
        background: var(--surface-2);
        border: 1px solid var(--border-2);
        border-radius: 4px;
        padding: 1px 5px;
        font: 12px "JetBrains Mono", monospace;
        color: var(--text-bright);
      }
      .md-body .md-diagram {
        background: var(--surface);
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 14px 18px;
        margin: 10px 0 16px;
        font: 13px/1.6 "JetBrains Mono", monospace;
        color: var(--text-bright);
        white-space: pre-wrap;
        overflow-x: auto;
        text-align: center;
      }
      .md-body h3.md-h {
        font-size: 18px;
      }
      .md-body .md-hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 18px 0;
      }
      .md-body .md-quote {
        border-left: 3px solid var(--accent);
        margin: 10px 0 16px;
        padding: 2px 0 2px 14px;
      }
      .md-body .md-quote div {
        color: var(--text-bright);
      }
      .md-body .md-quote .md-quote-gap {
        height: 6px;
      }
      .md-body ul,
      .md-body ol {
        margin: 4px 0 14px 22px;
      }
      .md-body li {
        margin-bottom: 4px;
      }
      .md-body .md-table {
        width: 100%;
        border-collapse: collapse;
        margin: 10px 0 16px;
        font-size: 13px;
      }
      .md-body .md-table th,
      .md-body .md-table td {
        border: 1px solid var(--border-2);
        padding: 6px 10px;
        text-align: left;
      }
      .md-body .md-table th {
        background: var(--surface-2);
        color: var(--text-bright);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <a class="btn" href="./index.html" title="Home">🏠</a>
        <span class="title">🔤 단어 탐구</span>
        <nav>
          <a href="./listening.html">Listening</a>
          <a href="./speaking.html">Speaking</a>
          <a href="./writing.html">Writing</a>
          <a href="./vocabulary.html">Vocabulary</a>
        </nav>
        <span class="spacer"></span>
      </header>

      <main class="main-grid" id="main-grid">
        <aside class="sidebar">
          <div class="side-head">
            <span>최근 검색</span>
          </div>
          <div id="word-list"></div>
        </aside>

        <section class="pane" id="content-pane">
          <div id="search-row">
            <input
              type="text"
              id="word-input"
              placeholder="궁금한 영어 단어를 입력하세요 (예: ubiquitous)"
              autocomplete="off"
            />
            <select id="ai-engine" title="AI 엔진">
              <option value="claude">☁️ Claude</option>
              <option value="openai">☁️ OpenAI</option>
              <option value="ollama">🏠 Local (Ollama, 무료)</option>
            </select>
            <button class="btn primary" id="search-btn">🔍 찾아보기</button>
          </div>
          <div class="stt-status" id="vocab-status" style="text-align: center"></div>

          <div id="vocab-view" style="display: none">
            <div class="word-hero">
              <span class="headword" id="v-word"></span>
            </div>
            <div class="md-body" id="v-body"></div>
          </div>

          <div class="vocab-hint" id="vocab-hint">
            영어 단어를 하나 입력해 보세요.<br />
            어원이 뭔지, 왜 그런 뜻을 갖게 됐는지, 실제로 어떻게 쓰는지<br />
            간단하지만 확실하게 설명해드립니다.
          </div>
        </section>
      </main>
    </div>

    <script src="./js/config.local.js"></script>
    <script type="module" src="./js/vocabulary.js"></script>
  </body>
</html>
