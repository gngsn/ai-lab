goal: >
  Build a personalized service platform where users customize what a service does
  and how it delivers content, with AI-powered message routing, multi-messenger
  bot support, and a plugin-based service architecture. First milestone: one
  messenger bot + vocabulary learning plugin + user preferences + personalized
  content delivery.

constraints:
  - Python 3.11+ with FastAPI (continue existing codebase)
  - Supabase (PostgreSQL) for persistence — migrate from SQLite
  - LLM provider-agnostic abstraction for AI routing
  - Services integrate as Python plugin modules (in-process)
  - Messenger bot support must be platform-agnostic (not tied to Telegram)
  - Platform handles both inbound and outbound message flow
  - Community scale target (100-1000 users)
  - Features are configurable (not simple toggles) — each has user settings

acceptance_criteria:
  - Users can register and set preferences (features + channels + settings per feature)
  - Services can be registered as Python plugin modules with capability manifests
  - At least one messenger bot channel works end-to-end (send + receive)
  - AI routing classifies inbound messages and routes to the correct service plugin
  - Vocabulary learning plugin delivers personalized content based on user preferences
  - Feature configuration supports per-feature settings (frequency, schedule, difficulty)
  - Delivery channels are abstracted (messenger bot, email, web dashboard interfaces defined)
  - User preferences persist in Supabase

ontology_schema:
  name: PersonalizedServicePlatform
  description: >
    Domain model for a platform that routes user messages to service plugins
    and delivers personalized content through configurable channels.
  fields:
    - name: user
      type: object
      description: Platform user with identity and authentication info
    - name: service_plugin
      type: object
      description: >
        Registered service module with name, description, capability manifest
        (supported intents, content types), and feature definitions
    - name: feature
      type: object
      description: >
        A configurable capability within a service (e.g., daily_review, quiz)
        with schema defining available settings (frequency, schedule, difficulty)
    - name: user_preference
      type: object
      description: >
        Per-user, per-service configuration: selected features with their settings,
        selected delivery channels with channel-specific config
    - name: delivery_channel
      type: object
      description: >
        Abstract delivery interface (messenger_bot, email, web_dashboard) with
        bidirectional support for messenger channels
    - name: message
      type: object
      description: >
        Inbound or outbound message with user_id, channel, content, direction,
        and routing metadata (classified intent, target service)
    - name: routing_result
      type: object
      description: >
        AI classification output: source message, detected intent,
        target service plugin, confidence score

evaluation_principles:
  - name: channel_agnosticism
    description: Same service logic works across all delivery channels without modification
    weight: 0.9
  - name: plugin_isolation
    description: Service plugins are self-contained and don't depend on platform internals
    weight: 0.8
  - name: preference_granularity
    description: Users can configure individual feature settings, not just toggle on/off
    weight: 0.8
  - name: routing_accuracy
    description: AI routing correctly classifies messages to the intended service
    weight: 0.7
  - name: bidirectional_flow
    description: Platform handles both inbound user messages and outbound content delivery
    weight: 0.9

exit_conditions:
  - name: v01_complete
    description: First milestone is functional end-to-end
    criteria: >
      One messenger bot receives user messages, AI routes them to vocab plugin,
      plugin processes and responds, user preferences affect content delivery
  - name: tests_pass
    description: Core functionality covered by tests
    criteria: >
      Preference engine, plugin registry, AI routing, and delivery channel
      tests all pass with pytest

