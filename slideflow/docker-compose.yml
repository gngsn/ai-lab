# Path A — vendor-neutral local backend (PLAN §3.5).
# Brings up a full backend with no Supabase account:
#   data   -> Postgres + PostgREST
#   auth   -> GoTrue (OSS; same JWT claims as Supabase Auth, so RLS SQL is identical)
#   blobs  -> MinIO (S3-compatible)
# The realtime WebSocket broadcaster is added in Phase 4.
#
# `npm run stack:up` waits for all healthchecks before returning.

name: slideflow

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slideflow
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d slideflow']
      interval: 3s
      timeout: 3s
      retries: 20

  rest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/slideflow
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-dev-jwt-token-with-at-least-32-chars
      PGRST_APP_SETTINGS_JWT_SECRET: super-secret-dev-jwt-token-with-at-least-32-chars
    ports:
      - '3001:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    image: supabase/gotrue:v2.151.0
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/slideflow?search_path=auth
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_JWT_SECRET: super-secret-dev-jwt-token-with-at-least-32-chars
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_DISABLE_SIGNUP: 'false'
      API_EXTERNAL_URL: http://localhost:3002
      PORT: '9999'
    ports:
      - '3002:9999'
    depends_on:
      db:
        condition: service_healthy

  blobs:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - blob-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  blob-data:
