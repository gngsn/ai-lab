# Path A — vendor-neutral local backend (PLAN §3.5).
# Brings up a full backend with no Supabase account:
#   data   -> Postgres + PostgREST
#   auth   -> dev-JWT issued by adapters/local/local-auth.ts, signed with the
#             shared PGRST_JWT_SECRET. The auth-compat migration (0001) provides a
#             Supabase-compatible auth.uid()/auth.users so RLS SQL is identical to cloud.
#   blobs  -> MinIO (S3-compatible)
# The realtime WebSocket broadcaster is added in Phase 4.
#
# `npm run stack:up` waits for all healthchecks before returning.

name: slideflow

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slideflow
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      # Create PostgREST's roles at init time so `rest` always connects cleanly.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d slideflow']
      interval: 3s
      timeout: 3s
      retries: 20

  rest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/slideflow
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-dev-jwt-token-with-at-least-32-chars
      PGRST_APP_SETTINGS_JWT_SECRET: super-secret-dev-jwt-token-with-at-least-32-chars
    ports:
      - '3001:3000'
    depends_on:
      db:
        condition: service_healthy
    # PostgREST's minimal image has no shell/wget for a healthcheck; it starts in
    # well under a second once the DB is healthy. Readiness is verified by db:migrate.

  blobs:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - blob-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  blob-data:
