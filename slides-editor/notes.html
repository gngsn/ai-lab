<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        accent-color: var(--se-ink);
        background: var(--se-bg);
        color: var(--se-ink);
        font-family: "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
        margin: 0;
        padding: 0;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--se-bg);
        border-bottom: 1px solid var(--se-ink);
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .title {
        font-size: 14px;
        font-weight: 500;
        color: var(--se-strong);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 320px;
        font-family: "Fraunces", "IBM Plex Sans KR", Georgia, serif;
        font-weight: 400;
        letter-spacing: -0.02em;
      }
      .spacer {
        flex: 1;
      }
      .btn {
        background: transparent;
        border: 1px solid var(--se-ink);
        color: var(--se-muted);
        padding: 5px 10px;
        border-radius: 0;
        font:
          12px "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
        cursor: pointer;
        text-decoration: none;
        transition:
          background 0.12s,
          color 0.12s,
          border-color 0.12s;
      }
      .btn:hover {
        background: var(--se-fill);
        color: var(--se-ink);
        border-color: var(--se-rule);
      }
      .btn.home {
        color: var(--se-strong);
      }
      .btn.ok {
        color: var(--se-ok);
        border-color: var(--se-ok);
      }
      .btn.warn {
        color: var(--se-warn);
        border-color: var(--se-warn);
      }
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px 20px 80px;
      }
      .hint {
        color: var(--se-muted);
        font-size: 11px;
        margin: 12px 0 8px;
        font-family: "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
        line-height: 1.6;
      }
      .hint code {
        color: var(--se-ink);
        background: var(--se-bg);
        padding: 1px 5px;
        border-radius: 0;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.7;
        color: var(--se-ink);
        background: var(--se-bg);
        border: 1px solid var(--se-ink);
        border-radius: 0;
        padding: 16px 18px;
        margin: 0;
      }
      .err {
        color: var(--se-bad);
        padding: 2rem;
        font-family: monospace;
      }
      @media (max-width: 768px) {
        /* Toolbar becomes a horizontally scrollable strip instead of
           widening the page. */
        header {
          min-width: 0;
          flex-wrap: nowrap;
          overflow-x: auto;
          overflow-y: hidden;
          scrollbar-width: none;
        }
        header::-webkit-scrollbar {
          display: none;
        }
        header > * {
          flex-shrink: 0;
        }
        .title {
          max-width: 40vw;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="title" id="deck-title">…</span>
      <span class="spacer"></span>
      <a class="btn home" href="./index.html" title="Home">⌂ Home</a>
      <a class="btn" id="pronunciation-link" href="#">🔊 Pronunciation</a>
      <a class="btn" id="pronunciation-link" href="#">🔊 Pronunciation</a>
      <a class="btn" id="script-link" href="#" target="_blank">⌨ Script</a>
      <button class="btn" id="tts-btn">▶ TTS</button>
      <button class="btn" id="tts-stop-btn">■ Stop</button>
      <button class="btn" id="copy-btn">Copy</button>
      <button class="btn" id="download-btn">Download .md</button>
    </header>
    <main>
      <p class="hint">
        Marp 형식 — 그대로 <code>marp notes.md -o notes.pdf</code>로 변환
        가능합니다.
      </p>
      <pre id="content">loading…</pre>
    </main>

    <script src="./js/config.local.js"></script>
    <script type="module">
      import { ensureAuthed } from "./js/auth.js";
      import { buildNotesMd, exportNotesMd } from "./js/export.js";

      if (!ensureAuthed()) {
        document.body.innerHTML =
          '<p class="err">Access denied — Marp view is owner-only.</p>';
        throw new Error("auth");
      }

      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const deckId = params.get("deck");
      if (!deckId) {
        document.body.innerHTML =
          '<p class="err">Missing ?deck=&lt;deck_id&gt;</p>';
        throw new Error("no deck");
      }

      $("pronunciation-link").href =
        `./pronunciation.html?deck=${encodeURIComponent(deckId)}`;
      $("script-link").href =
        `./script.html?deck=${encodeURIComponent(deckId)}`;

      try {
        const { deck, content } = await buildNotesMd(deckId);
        $("deck-title").textContent = deck.title || deckId;
        document.title = `Notes · ${deck.title || deckId}`;
        // textContent → plain text (HTML escaped automatically).
        $("content").textContent = content;

        const synth = window.speechSynthesis;
        let utterance = null;

        const cleanForSpeech = (text) =>
          text
            .replace(/^#{1,6}\s+/gm, "")
            .replace(/^---\s*$/gm, "")
            .replace(/^\[Next\]\s*/gm, "Next. ")
            .replace(/\*\*(.+?)\*\*/g, "$1")
            .replace(/\*(.+?)\*/g, "$1")
            .replace(/`(.+?)`/g, "$1")
            .replace(/\s+\n/g, "\n")
            .replace(/\n{3,}/g, "\n\n")
            .trim();

        const updateTtsButtons = () => {
          const playBtn = $("tts-btn");
          const stopBtn = $("tts-stop-btn");
          const speaking = synth?.speaking;
          const paused = synth?.paused;
          playBtn.textContent = paused
            ? "▶ Resume"
            : speaking
              ? "⏸ Pause"
              : "▶ TTS";
          playBtn.classList.toggle("warn", speaking || paused);
          stopBtn.disabled = !speaking && !paused;
        };

        const stopSpeech = () => {
          if (!synth) return;
          synth.cancel();
          utterance = null;
          updateTtsButtons();
        };

        const speakNotes = () => {
          if (!synth) {
            alert("This browser does not support speech synthesis.");
            return;
          }

          if (synth.speaking && synth.paused) {
            synth.resume();
            updateTtsButtons();
            return;
          }

          if (synth.speaking) {
            synth.pause();
            updateTtsButtons();
            return;
          }

          stopSpeech();
          utterance = new SpeechSynthesisUtterance(cleanForSpeech(content));
          utterance.lang = "en-US";
          utterance.rate = 1.0;
          utterance.pitch = 1.0;
          utterance.onend = updateTtsButtons;
          utterance.onerror = updateTtsButtons;
          synth.speak(utterance);
          updateTtsButtons();
        };

        $("tts-btn").addEventListener("click", speakNotes);
        $("tts-stop-btn").addEventListener("click", stopSpeech);
        updateTtsButtons();

        $("copy-btn").addEventListener("click", async () => {
          try {
            await exportNotesMd(deckId, { copy: true });
            const btn = $("copy-btn");
            const orig = btn.textContent;
            btn.textContent = "✓ Copied";
            btn.classList.add("ok");
            setTimeout(() => {
              btn.textContent = orig;
              btn.classList.remove("ok");
            }, 1400);
          } catch (err) {
            alert("Copy failed: " + err.message);
          }
        });
        $("download-btn").addEventListener("click", () =>
          exportNotesMd(deckId),
        );
      } catch (err) {
        document.body.innerHTML = `<p class="err">${err.message}</p>`;
      }
    </script>
  </body>
</html>
