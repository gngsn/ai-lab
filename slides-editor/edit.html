<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --accent: #5db8a6;
        --bg: #0c0c0c;
        --surface: #141414;
        --surface-2: #1a1a1a;
        --border: #1f1f1f;
        --text: #c8c8c8;
        --text-mid: #777;
        --text-bright: #f0f0f0;
        --danger: #ef4444;
        --warn: #e8a55a;
        --ok: #22c55e;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Sans KR", sans-serif;
        height: 100vh; overflow: hidden;
      }

      #app { display: grid; grid-template-rows: 48px 1fr; height: 100vh; }

      /* Toolbar */
      #toolbar {
        display: flex; align-items: center; gap: 8px;
        padding: 0 14px; background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      #toolbar .title {
        font-size: 14px; font-weight: 500;
        color: var(--text-bright); margin-right: 8px;
      }
      #toolbar .spacer { flex: 1; }
      #status {
        font-size: 11px; font-family: "JetBrains Mono", monospace;
        color: var(--text-mid); min-width: 160px; text-align: right;
      }
      #status[data-kind="ok"]  { color: var(--ok); }
      #status[data-kind="err"] { color: var(--danger); }

      .btn {
        display: inline-flex; align-items: center; gap: 4px;
        background: transparent; border: 1px solid var(--border);
        color: var(--text-mid); padding: 5px 10px; border-radius: 5px;
        font-size: 12px; font-family: inherit; cursor: pointer;
        text-decoration: none;
        transition: background .12s, color .12s, border-color .12s;
      }
      .btn:hover { background: #1e1e1e; color: var(--text); border-color: #333; }
      .btn.active { background: #1e2e1e; color: var(--accent); border-color: var(--accent); }
      .btn.danger:hover { color: var(--danger); border-color: var(--danger); }
      .btn:disabled { opacity: .4; cursor: not-allowed; }

      /* Body grid */
      #body {
        display: grid;
        grid-template-columns: 240px 1fr 280px;
        height: calc(100vh - 48px);
      }

      /* Slide list */
      #slide-list {
        background: var(--surface); border-right: 1px solid var(--border);
        overflow-y: auto; padding: 8px;
      }
      .slide-item {
        display: flex; align-items: center; gap: 6px;
        padding: 8px 10px; margin-bottom: 4px;
        border-radius: 5px; cursor: pointer;
        font-size: 13px; color: var(--text-mid);
        border: 1px solid transparent;
        user-select: none;
      }
      .slide-item:hover { background: var(--surface-2); color: var(--text); }
      .slide-item.active {
        background: #1e2e1e; color: var(--text-bright);
        border-color: var(--accent);
      }
      .slide-item .order {
        font-size: 10px; color: var(--text-mid);
        font-family: "JetBrains Mono", monospace;
        min-width: 18px; text-align: right;
      }
      .slide-item .title {
        flex: 1; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap;
      }
      .slide-item.dragging { opacity: .4; }
      .slide-item.drag-over { border-color: var(--accent); }

      #add-slide {
        width: 100%; padding: 8px;
        background: transparent;
        border: 1px dashed var(--border);
        color: var(--text-mid); border-radius: 5px;
        cursor: pointer; font-family: inherit; font-size: 12px;
        margin-top: 8px;
      }
      #add-slide:hover { border-color: var(--accent); color: var(--accent); }

      /* Canvas */
      #canvas-wrap {
        background: #000; display: grid; place-items: center;
        overflow: hidden; padding: 24px;
      }
      #canvas {
        width: 100%; height: 100%; border: 0;
        background: #0c0c0c;
        box-shadow: 0 4px 24px rgba(0,0,0,.5);
      }

      /* Props */
      #props {
        background: var(--surface); border-left: 1px solid var(--border);
        padding: 16px; overflow-y: auto; font-size: 12px;
      }
      #props h3 {
        font-size: 10px; text-transform: uppercase;
        letter-spacing: .1em; color: var(--text-mid);
        margin-bottom: 10px; font-weight: 600;
      }
      #props .field { margin-bottom: 14px; }
      #props label {
        display: block; font-size: 10px; color: var(--text-mid);
        margin-bottom: 4px;
      }
      #props input, #props textarea {
        width: 100%; background: var(--bg);
        border: 1px solid var(--border); color: var(--text);
        padding: 6px 8px; border-radius: 4px;
        font-family: inherit; font-size: 12px;
      }
      #props input:focus, #props textarea:focus {
        outline: none; border-color: var(--accent);
      }
      #props code {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px; color: var(--text-mid);
        word-break: break-all; display: block;
        padding: 4px 6px; background: var(--bg);
        border-radius: 3px;
      }

      /* Modal */
      .modal-bg {
        position: fixed; inset: 0;
        background: rgba(0,0,0,.7); display: none; z-index: 1000;
      }
      .modal-bg.show { display: grid; place-items: center; }
      .modal {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 8px; padding: 18px;
        width: min(900px, 90vw); height: min(700px, 85vh);
        display: flex; flex-direction: column; gap: 10px;
      }
      .modal h2 { font-size: 14px; color: var(--text-bright); }
      .modal p { font-size: 11px; color: var(--text-mid); }
      .modal textarea {
        flex: 1; background: var(--bg);
        border: 1px solid var(--border); color: var(--text);
        padding: 10px; border-radius: 4px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px; line-height: 1.5; resize: none;
      }
      .modal .actions {
        display: flex; justify-content: flex-end; gap: 8px;
      }

      /* Toast */
      #toast {
        position: fixed; bottom: 18px; left: 50%;
        transform: translateX(-50%);
        background: var(--surface); border: 1px solid var(--border);
        padding: 8px 16px; border-radius: 20px;
        font-size: 12px; display: none; z-index: 1500;
      }
      #toast.show { display: block; }
      #toast.err { border-color: var(--danger); color: var(--danger); }
      #toast.ok  { border-color: var(--ok); color: var(--ok); }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <span class="title" id="deck-title">…</span>
        <button class="btn" id="edit-toggle">Edit · on (E)</button>
        <button class="btn" id="frame-edit">Frame…</button>
        <span class="spacer"></span>
        <a class="btn" id="script-link" href="#" target="_blank">⌨ Script</a>
        <a class="btn" id="present-link" href="#" target="_blank">▶ Present</a>
        <span id="status">—</span>
      </header>
      <main id="body">
        <aside id="slide-list"></aside>
        <div id="canvas-wrap"><iframe id="canvas" src="about:blank"></iframe></div>
        <aside id="props">
          <h3>Slide</h3>
          <div class="field">
            <label>Title</label>
            <input id="prop-title" />
          </div>
          <div class="field">
            <label>section_id</label>
            <code id="prop-section-id">—</code>
          </div>
          <div class="field">
            <label>order</label>
            <code id="prop-order">—</code>
          </div>
          <div style="margin-top: 18px">
            <button class="btn danger" id="delete-slide" disabled>
              Delete slide…
            </button>
          </div>
        </aside>
      </main>
    </div>

    <div class="modal-bg" id="frame-modal-bg">
      <div class="modal">
        <h2>Edit frame_html</h2>
        <p>
          반드시 <code>&lt;!-- slides --&gt;</code> placeholder가 포함돼야 합니다
          (없으면 자동 삽입).
        </p>
        <textarea id="frame-textarea" spellcheck="false"></textarea>
        <div class="actions">
          <button class="btn" id="frame-cancel">Cancel</button>
          <button class="btn active" id="frame-save">Save</button>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <script src="./js/config.local.js"></script>
    <script type="module" src="./js/edit-bootstrap.js"></script>
  </body>
</html>
